<!DOCTYPE html>
<html lang="ja">
<head>
  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>GIF HOME</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
  touch-action: manipulation;
  overscroll-behavior: none;
  font-family: Arial, Helvetica, sans-serif;
}

.site-header {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 64px;

  background: rgba(0, 0, 0, 0.92);

  display: flex;
  align-items: center;

  z-index: 5000;

  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.menu-button {
  width: 64px;
  height: 64px;

  border: none;
  background: transparent;

  color: white;
  font-size: 34px;

  cursor: pointer;

  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.site-title {
  color: white;
  font-size: 20px;
  letter-spacing: 3px;
}

.side-menu {
  position: fixed;
  top: 64px;
  left: 0;

  width: 220px;
  height: calc(100vh - 64px);

  background: rgba(0, 0, 0, 0.96);

  transform: translateX(-100%);
  transition: transform 0.25s ease;

  z-index: 4999;

  display: flex;
  flex-direction: column;

  padding-top: 20px;
}

.side-menu.open {
  transform: translateX(0);
}

.side-menu a {
  color: white;
  text-decoration: none;

  padding: 18px 22px;

  font-size: 18px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.side-menu a:active {
  background: #333;
}

.gif-wall {
  padding-top: 64px;

  width: 100vw;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
}

.gif-wall img {
  width: 100%;
  aspect-ratio: 1 / 1;

  object-fit: cover;
  display: block;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
</style>
</head>

<body>

<header class="site-header">
  <button class="menu-button" id="menuButton">☰</button>
  <div class="site-title">GIF HOME</div>
</header>

<nav class="side-menu" id="sideMenu">
  <a href="index.html">ホーム</a>
  <a href="puyopuyo.html">ぶよぶよ</a>
</nav>

<div class="gif-wall" id="gifWall"></div>

<script>
const menuButton = document.getElementById("menuButton");
const sideMenu = document.getElementById("sideMenu");
const gifWall = document.getElementById("gifWall");

menuButton.addEventListener("click", () => {
  sideMenu.classList.toggle("open");
});

const GIF_PATH = "images/IMG_6574.GIF";

for (let i = 0; i < 102; i++) {
  const img = document.createElement("img");
  img.src = GIF_PATH;
  img.alt = "gif";
  gifWall.appendChild(img);
}

let lastTouchEnd = 0;

document.addEventListener(
  "touchend",
  (e) => {
    const now = Date.now();

    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }

    lastTouchEnd = now;
  },
  { passive: false }
);
</script>

</body>
</html>
