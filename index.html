<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>わらわらサイト</title>

  <meta name="description" content="広告無しでストレスフリーに閲覧できる動画サイト。">

  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">

    <div class="menu-button" id="menuButton">
      ☰
    </div>

    <div class="header-center">

      <a href="about.html" class="logo-link">
        <img src="images/logo.png" class="site-logo" alt="ロゴ">
      </a>

      <div class="site-title">
        わらわらサイト
      </div>

    </div>

  </header>

  <nav class="side-menu" id="sideMenu">

    <a href="about.html" class="menu-main">
      このサイトについて
    </a>

    <div class="menu-space"></div>

    <a href="#" data-category="全て">全て</a>
    <a href="#" data-category="事故">事故</a>
    <a href="#" data-category="動物">動物</a>
    <a href="#" data-category="管理人おすすめ">管理人おすすめ</a>
    <a href="#" data-category="本日の一品">本日の一品</a>
    <a href="visitors.html">訪問者数</a>

  </nav>

  <div class="menu-overlay" id="menuOverlay"></div>

  <main id="video-list"></main>

  <div id="pagination"></div>

  <script>

    const menuButton = document.getElementById("menuButton");
    const sideMenu = document.getElementById("sideMenu");
    const menuOverlay = document.getElementById("menuOverlay");

    menuButton.addEventListener("click", () => {
      sideMenu.classList.toggle("open");
      menuOverlay.classList.toggle("show");
    });

    menuOverlay.addEventListener("click", () => {
      sideMenu.classList.remove("open");
      menuOverlay.classList.remove("show");
    });

    fetch("videos.json")
      .then(res => res.json())
      .then(videos => {

        const container = document.getElementById("video-list");
        const pagination = document.getElementById("pagination");

        const videosPerPage = 10;

        let currentPage = 1;
        let currentCategory = "全て";

        function getFilteredVideos() {

          if (currentCategory === "全て") {
            return videos;
          }

          return videos.filter(video => {

            if (Array.isArray(video.category)) {
              return video.category.includes(currentCategory);
            }

            return video.category === currentCategory;

          });

        }

        async function getViews(videoId) {

          try {

            const response = await fetch(
              `https://api.countapi.xyz/get/warawara-site/video-${videoId}`
            );

            const data = await response.json();

            return data.value || 0;

          } catch {

            return 0;

          }

        }

        async function incrementViews(videoId) {

          try {

            await fetch(
              `https://api.countapi.xyz/hit/warawara-site/video-${videoId}`
            );

          } catch {}

        }

        async function showPage(page) {

          container.innerHTML = "";
          pagination.innerHTML = "";

          const filteredVideos = getFilteredVideos();

          const start = (page - 1) * videosPerPage;
          const end = start + videosPerPage;

          const pageVideos = filteredVideos.slice(start, end);

          for (const video of pageVideos) {

            const views = await getViews(video.id);

            const card = document.createElement("a");

            card.className = "video-card";
            card.href = video.video;
            card.target = "_blank";

            card.innerHTML = `
              <div class="thumbnail-wrap">
                <img src="${video.thumbnail}" class="thumbnail" alt="サムネイル">
              </div>

              <div class="video-info">

                <div class="video-text">

                  <div class="video-title">
                    ${video.title}
                  </div>

                  <div class="video-description">
                    ${video.description}
                  </div>

                  <div class="video-meta">
                    ${views}回視聴 ・ ${video.date}
                  </div>

                </div>

              </div>
            `;

            card.addEventListener("click", () => {
              incrementViews(video.id);
            });

            container.appendChild(card);

          }

          const totalPages = Math.ceil(filteredVideos.length / videosPerPage);

          for (let i = 1; i <= totalPages; i++) {

            const button = document.createElement("button");

            button.textContent = i;

            if (i === page) {
              button.style.fontWeight = "bold";
            }

            button.addEventListener("click", () => {

              currentPage = i;

              showPage(currentPage);

              window.scrollTo(0, 0);

            });

            pagination.appendChild(button);

          }

        }

        document.querySelectorAll(".side-menu a[data-category]").forEach(link => {

          link.addEventListener("click", e => {

            e.preventDefault();

            currentCategory = link.dataset.category;
            currentPage = 1;

            showPage(currentPage);

            sideMenu.classList.remove("open");
            menuOverlay.classList.remove("show");

            window.scrollTo(0, 0);

          });

        });

        showPage(currentPage);

      });

  </script>

</body>

</html>
