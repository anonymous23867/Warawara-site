<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わらわらサイト</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <img src="images/logo.png" class="site-logo" alt="ロゴ">
    <h1 class="site-title">わらわらサイト</h1>
  </header>

  <main id="video-list"></main>

  <script>
    fetch("videos.json")
      .then(res => res.json())
      .then(videos => {
        const container = document.getElementById("video-list");

        videos.forEach(video => {
          const card = document.createElement("a");

          card.className = "video-card";
          card.href = video.video;
          card.target = "_blank";

          card.innerHTML = `
            <div class="thumbnail-wrap">
              <img src="${video.thumbnail}" class="thumbnail" alt="サムネイル">
            </div>

            <div class="video-info">
              <img src="${video.icon}" class="channel-icon" alt="アイコン">

              <div class="video-text">
                <div class="video-title">${video.title}</div>
                <div class="video-description">${video.description}</div>
                <div class="video-meta">${video.views} ・ ${video.date}</div>
              </div>
            </div>
          `;

          container.appendChild(card);
        });
      });
  </script>

</body>

</html>
