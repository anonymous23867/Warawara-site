<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わらわらサイト</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <div class="menu-button" id="menuButton">☰</div>

    <div class="header-center">
      <img src="images/logo.png" class="site-logo" alt="ロゴ">
      <div class="site-title">わらわらサイト</div>
    </div>
  </header>

  <nav class="side-menu" id="sideMenu">
    <a href="about.html" class="menu-link about-link">このサイトについて</a>

    <div class="menu-space"></div>

    <a href="index.html" class="menu-link">全て</a>
    <a href="#" class="menu-link">事故</a>
    <a href="#" class="menu-link">動物</a>
    <a href="#" class="menu-link">管理人おすすめ</a>
    <a href="#" class="menu-link">本日の一品</a>
    <a href="visitors.html" class="menu-link">訪問者数</a>
  </nav>

  <div class="menu-overlay" id="menuOverlay"></div>

  <main id="video-list"></main>

  <script>
    const menuButton = document.getElementById("menuButton");
    const sideMenu = document.getElementById("sideMenu");
    const menuOverlay = document.getElementById("menuOverlay");

    menuButton.addEventListener("click", () => {
      sideMenu.classList.toggle("active");
      menuOverlay.classList.toggle("active");
    });

    menuOverlay.addEventListener("click", () => {
      sideMenu.classList.remove("active");
      menuOverlay.classList.remove("active");
    });

    fetch("videos.json")
      .then(res => res.json())
      .then(videos => {
        const container = document.getElementById("video-list");

        videos.forEach(video => {
          const card = document.createElement("a");
          card.className = "video-card";
          card.href = video.video;
          card.target = "_blank";

          card.innerHTML = `
            <img src="${video.thumbnail}" class="thumbnail" alt="${video.title}">

            <div class="video-info">
              <div class="video-title">${video.title}</div>
              <div class="video-meta">
                <span id="views-${video.id}">読み込み中</span>・${video.date}
              </div>
            </div>
          `;

          container.appendChild(card);

          fetch(`https://api.countapi.xyz/hit/warawara-site/video-${video.id}`)
            .then(res => res.json())
            .then(data => {
              document.getElementById(`views-${video.id}`).textContent =
                `${data.value}回視聴`;
            })
            .catch(() => {
              document.getElementById(`views-${video.id}`).textContent =
                `0回視聴`;
            });
        });
      });
  </script>

</body>

</html>
