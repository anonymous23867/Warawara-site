<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わらわらサイト</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <a href="about.html">
      <img src="images/dange.png" class="site-logo" alt="説明ページ">
    </a>

  
    <h1 class="site-title">わらわらサイト</h1>
  </header>

  <main id="video-list"></main>

  <div id="pagination"></div>

  <script>
    fetch("videos.json")
      .then(res => res.json())
      .then(videos => {
        const container = document.getElementById("video-list");
        const pagination = document.getElementById("pagination");
        const videosPerPage = 10;
        let currentPage = 1;

        function showPage(page) {
          container.innerHTML = "";
          pagination.innerHTML = "";

          const start = (page - 1) * videosPerPage;
          const end = start + videosPerPage;
          const pageVideos = videos.slice(start, end);

          pageVideos.forEach(video => {
            const card = document.createElement("a");

            card.className = "video-card";
            card.href = video.video;
            card.target = "_blank";

            card.innerHTML = `
              <div class="thumbnail-wrap">
                <img src="${video.thumbnail}" class="thumbnail" alt="サムネイル">
              </div>

              <div class="video-info">
                <img src="${video.icon}" class="channel-icon" alt="アイコン">

                <div class="video-text">
                  <div class="video-title">${video.title}</div>
                  <div class="video-description">${video.description}</div>
                  <div class="video-meta">${video.views} ・ ${video.date}</div>
                </div>
              </div>
            `;

            container.appendChild(card);
          });

          const totalPages = Math.ceil(videos.length / videosPerPage);

          for (let i = 1; i <= totalPages; i++) {
            const button = document.createElement("button");
            button.textContent = i;

            if (i === page) {
              button.style.fontWeight = "bold";
            }

            button.addEventListener("click", () => {
              currentPage = i;
              showPage(currentPage);
              window.scrollTo(0, 0);
            });

            pagination.appendChild(button);
          }
        }

        showPage(currentPage);
      });
  </script>

</body>

</html>
