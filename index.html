<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わらわらサイト</title>

  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <button class="menu-button" id="menuButton" type="button">
      ☰
    </button>

    <div class="header-center">
      <img src="images/logo.png" class="site-logo" alt="ロゴ">

      <div class="site-title">
        わらわらサイト
      </div>
    </div>
  </header>

  <nav class="side-menu" id="sideMenu">

    <a href="about.html" class="menu-link about-link">
      このサイトについて
    </a>

    <a href="visitor.html" class="menu-link">
      訪問者数
    </a>

    <div class="menu-space"></div>

    <a href="#" class="menu-link category-link" data-category="all">
      全て
    </a>

    <a href="#" class="menu-link category-link" data-category="事故">
      事故
    </a>

    <a href="#" class="menu-link category-link" data-category="動物">
      動物
    </a>

    <a href="#" class="menu-link category-link" data-category="管理人のおすすめ">
      管理人のおすすめ
    </a>

    <a href="#" class="menu-link category-link" data-category="本日の一品">
      本日の一品
    </a>

  </nav>

  <div class="menu-overlay" id="menuOverlay"></div>

  <main id="video-list" class="video-list"></main>

  <div id="pagination" class="pagination"></div>

  <script>

    const menuButton = document.getElementById("menuButton");
    const sideMenu = document.getElementById("sideMenu");
    const menuOverlay = document.getElementById("menuOverlay");

    const videoList = document.getElementById("video-list");
    const pagination = document.getElementById("pagination");

    let allVideos = [];

    let currentCategory = "all";
    let currentPage = 1;

    const videosPerPage = 10;

    menuButton.addEventListener("click", () => {
      sideMenu.classList.toggle("open");
      menuOverlay.classList.toggle("open");
    });

    menuOverlay.addEventListener("click", () => {
      sideMenu.classList.remove("open");
      menuOverlay.classList.remove("open");
    });

    function getFilteredVideos() {

      const reversedVideos = [...allVideos].reverse();

      if (currentCategory === "all") {
        return reversedVideos;
      }

      return reversedVideos.filter(video => {

        if (Array.isArray(video.category)) {
          return video.category.includes(currentCategory);
        }

        return video.category === currentCategory;

      });

    }

    function showVideos() {

      videoList.innerHTML = "";

      const filteredVideos = getFilteredVideos();

      const startIndex =
        (currentPage - 1) * videosPerPage;

      const endIndex =
        startIndex + videosPerPage;

      const videosToShow =
        filteredVideos.slice(startIndex, endIndex);

      videosToShow.forEach(video => {

        const card = document.createElement("article");

        card.className = "video-card";

        card.innerHTML = `
          <a href="${video.video}"
             class="thumbnail-link"
             target="_blank">

            <img src="${video.thumbnail}"
                 class="thumbnail"
                 alt="${video.title}">
          </a>

          <div class="video-info">

            <div class="video-text">

              <div class="video-title">
                ${video.title}
              </div>

              <div class="video-description">
                ${video.description}
              </div>

            <div class="video-meta">
                 ${video.date}
              </div>  

            </div>

          </div>
        `;

        videoList.appendChild(card);

      });

      showPagination(filteredVideos.length);

    }

    function showPagination(totalVideos) {

      pagination.innerHTML = "";

      const totalPages =
        Math.ceil(totalVideos / videosPerPage);

      if (totalPages <= 1) {
        return;
      }

      for (let i = 1; i <= totalPages; i++) {

        const button =
          document.createElement("button");

        button.textContent = i;

        button.className = "page-button";

        if (i === currentPage) {
          button.classList.add("active");
        }

        button.addEventListener("click", () => {

          currentPage = i;

          showVideos();

          window.scrollTo(0, 0);

        });

        pagination.appendChild(button);

      }

    }

    fetch("videos.json")
      .then(response => response.json())
      .then(videos => {

        allVideos = videos;

        showVideos();

      });

    document
      .querySelectorAll(".category-link")
      .forEach(link => {

        link.addEventListener("click", event => {

          event.preventDefault();

          currentCategory =
            link.dataset.category;

          currentPage = 1;

          showVideos();

          sideMenu.classList.remove("open");

          menuOverlay.classList.remove("open");

        });

      });

  </script>

</body>

</html>
