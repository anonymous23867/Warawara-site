<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ランキング</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: sans-serif;
      padding: 20px;
      padding-bottom: 120px;
    }

    h1 {
      text-align: center;
    }

    .ranking-item {
      border-bottom: 1px solid #444;
      padding: 10px 0;
    }

    .rank {
      font-size: 20px;
      font-weight: bold;
    }

    .score {
      color: #00ff99;
    }

    #myRankBox {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;

      background: rgba(20, 20, 20, 0.98);
      border-top: 2px solid #00ff99;

      padding: 16px 12px;

      box-sizing: border-box;

      z-index: 9999;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;

      flex-wrap: wrap;

      font-size: 18px;
      font-weight: bold;

      text-align: center;
    }

    #myRankBox .my-score {
      color: #00ff99;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <h1>ランキング</h1>

  <div id="rankingList"></div>

  <div id="myRankBox">
    あなたの順位を読み込み中...
  </div>

  <script>
    async function loadRanking() {
      const res = await fetch("/api/ranking");
      const data = await res.json();

      const rankingList = document.getElementById("rankingList");
      const myRankBox = document.getElementById("myRankBox");

      const myUserId = localStorage.getItem("quizUserId");

      rankingList.innerHTML = "";

      data.forEach((player, index) => {
        const div = document.createElement("div");
        div.className = "ranking-item";

        div.innerHTML = `
          <div class="rank">
            ${index + 1}位　${player.name}
          </div>

          <div class="score">
            スコア：${player.score}
          </div>

          <div>
            問題数：${player.answered}問　
            正答率：${player.accuracy}%
          </div>
        `;

        rankingList.appendChild(div);
      });

      const myIndex = data.findIndex(player => {
        return player.user_id === myUserId;
      });

      if (myIndex !== -1) {
        const me = data[myIndex];

        myRankBox.innerHTML = `
          <span>あなたの順位：${myIndex + 1}位</span>
          <span class="my-score">スコア：${me.score}</span>
          <span>問題数：${me.answered}問</span>
          <span>正答率：${me.accuracy}%</span>
        `;
      } else {
        myRankBox.textContent =
          "あなたの順位：まだランキングに登録されていません";
      }
    }

    loadRanking();
  </script>

</body>
</html>
