<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画再生</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">

    <a href="index.html">
      <img src="images/logo.PNG" class="site-logo" alt="ロゴ">
    </a>

    <h1 class="site-title">わらわらサイト</h1>

  </header>

  <main class="watch-page">

    <video id="video-player" controls playsinline></video>

    <h2 id="video-title"></h2>

    <p id="video-info"></p>

  </main>

  <script>

    const params = new URLSearchParams(window.location.search);

    const id = Number(params.get("id"));

    fetch("videos.json")
      .then(res => res.json())
      .then(videos => {

        const video = videos.find(v => v.id === id);

        if (!video) {

          document.body.innerHTML += "<p>動画が見つかりません。</p>";

          return;

        }

        document.getElementById("video-player").src = video.video;

        document.getElementById("video-title").textContent = video.title;

        document.getElementById("video-info").textContent =
          `${video.channel} ・ ${video.views} ・ ${video.date}`;

      });

  </script>

</body>

</html>
