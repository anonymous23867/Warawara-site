<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>検いけクイズ</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="kenike-quiz-page">

    <section id="difficultyScreen" class="quiz-screen active">
      <h1>検いけクイズ</h1>

      <div class="difficulty-buttons">
        <button data-mode="easy">初級</button>
        <button data-mode="normal">中級</button>
        <button data-mode="hard">上級</button>
        <button data-mode="time">タイムアタック</button>
      </div>
    </section>

   <section id="introScreen" class="quiz-screen">
  <img id="introGif" src="images/IMG_7086.GIF" alt="START">
</section>

    <section id="quizScreen" class="quiz-screen">
      <div class="quiz-top">
        <span id="modeLabel"></span>
        <span id="progressText"></span>
        <span id="timerText"></span>
      </div>

      <div class="question-box">
        <div id="mediaBox"></div>
        <h2 id="questionText"></h2>
      </div>

      <div id="choices" class="choices"></div>
    </section>

    <section id="resultScreen" class="quiz-screen">
      <div class="result-box">
        <h1>RESULT</h1>
        <p id="resultScore"></p>
        <p id="resultRate"></p>
        <button id="backBtn">難易度選択へ戻る</button>
      </div>
    </section>

  </main>

  <script src="kenike-quiz.js"></script>
</body>
</html>
