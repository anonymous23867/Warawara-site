<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>ぶよぶよ</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #111;
  color: white;

  font-family: Arial, Helvetica, sans-serif;

  touch-action: manipulation;
  overscroll-behavior: none;

  user-select: none;
  -webkit-user-select: none;
}

body {
  position: fixed;
  inset: 0;
}

.game-wrap {
  width: 100vw;
  height: 100dvh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 6px;

  padding:
    max(6px, env(safe-area-inset-top))
    8px
    max(6px, env(safe-area-inset-bottom))
    8px;
}

h1 {
  margin: 0;

  letter-spacing: 2px;
  font-size: clamp(18px, 5vw, 24px);
}

.info {
  width: min(92vw, 300px);

  display: flex;
  justify-content: space-between;
  align-items: center;

  font-size: 14px;
}

button {
  border: none;
  background: #333;
  color: white;

  padding: 9px 10px;
  border-radius: 8px;

  font-size: 15px;

  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

button:active {
  transform: scale(0.95);
  background: #555;
}

canvas {
  background: #000;
  border: 3px solid #555;

  width: min(88vw, 300px);
  height: auto;

  aspect-ratio: 1 / 2;

  image-rendering: pixelated;

  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.controls {
  width: min(92vw, 300px);

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.controls button {
  min-height: 42px;
  font-size: 15px;
}

.help {
  margin: 0;

  color: #aaa;

  font-size: 11px;
  text-align: center;
  line-height: 1.35;
}

.home-link {
  color: white;
  text-decoration: none;

  background: #333;
  padding: 7px 12px;
  border-radius: 8px;

  font-size: 13px;
}
</style>
</head>

<body>

<main class="game-wrap">
  <h1>ぶよぶよ</h1>

  <a class="home-link" href="index.html">ホームへ戻る</a>

  <div class="info">
    <div>Score: <span id="score">0</span></div>
    <button id="restartBtn">RESTART</button>
  </div>

  <canvas id="game" width="288" height="576"></canvas>

  <div class="controls">
    <button id="leftBtn">←</button>
    <button id="rotateBtn">回転</button>
    <button id="rightBtn">→</button>
    <button id="downBtn">↓</button>
  </div>

  <p class="help">
    PC: ← → ↓ / Spaceで回転<br>
    スマホ: 下のボタンで操作
  </p>
</main>

<script src="script.js"></script>

<script>
function fitGameToScreen() {
  const canvas = document.getElementById("game");

  const screenW = window.innerWidth;
  const screenH = window.innerHeight;

  const maxW = screenW * 0.88;
  const maxH = screenH * 0.52;

  const widthByHeight = maxH / 2;

  const finalW = Math.min(maxW, widthByHeight, 300);
  const finalH = finalW * 2;

  canvas.style.width = finalW + "px";
  canvas.style.height = finalH + "px";
}

window.addEventListener("load", fitGameToScreen);
window.addEventListener("resize", fitGameToScreen);
window.addEventListener("orientationchange", fitGameToScreen);
</script>

</body>
</html>
